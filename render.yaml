services:
  - type: web
    name: bank-dannyh-odarennosti
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/achievements.db
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: PUBLIC_DEMO_MODE
        value: true
