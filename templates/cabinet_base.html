<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><script>try{document.documentElement.dataset.theme=localStorage.getItem('rd-theme')||((matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch(e){}</script><title>{% block title %}Мои достижения{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="cabinet-body"><header class="cabinet-top"><a class="cabinet-brand" href="{{ url_for('cabinet') }}"><span>Я</span> Мои достижения</a><button class="theme-button" type="button" data-theme-toggle aria-label="Переключить тему" aria-pressed="false"><span aria-hidden="true">◐</span></button>{% if g.child %}<div><span>{{ g.child.username }}</span><form method="post" action="{{ url_for('cabinet_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="cabinet-logout">Выйти</button></form></div>{% endif %}</header><main class="cabinet-shell"><section class="toast-region" aria-live="polite" aria-atomic="true">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}" role="status">{{ message }}<button class="flash-close" type="button" aria-label="Закрыть уведомление">×</button></div>{% endfor %}</section>{% block content %}{% endblock %}</main><script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
