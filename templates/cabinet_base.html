<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Мои достижения{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="cabinet-body"><header class="cabinet-top"><a class="cabinet-brand" href="{{ url_for('cabinet') }}"><span>Я</span> Мои достижения</a>{% if g.child %}<div><span>{{ g.child.username }}</span><form method="post" action="{{ url_for('cabinet_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="cabinet-logout">Выйти</button></form></div>{% endif %}</header><main class="cabinet-shell">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
