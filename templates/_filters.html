<form class="filters" method="get"><label>Организация<select name="school"><option value="">Все</option>{% for s in schools %}<option value="{{ s.school }}" {% if request.args.get('school') == s.school %}selected{% endif %}>{{ s.school }}</option>{% endfor %}</select></label>
<label>Направление<select name="direction"><option value="">Все</option>{% for key, label in DIRECTIONS.items() %}<option value="{{ key }}" {% if request.args.get('direction') == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Уровень<select name="level"><option value="">Все</option>{% for key, val in LEVELS.items() %}<option value="{{ key }}" {% if request.args.get('level') == key %}selected{% endif %}>{{ val[0] }}</option>{% endfor %}</select></label>
<label>С<input type="date" name="date_from" value="{{ request.args.get('date_from','') }}"></label><label>По<input type="date" name="date_to" value="{{ request.args.get('date_to','') }}"></label><button class="button">Применить</button><a class="button ghost" href="{{ request.path }}">Сбросить</a></form>
