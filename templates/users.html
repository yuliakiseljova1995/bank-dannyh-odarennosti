{% extends 'base.html' %}{% block title %}Пользователи{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">Администрирование</p><h1>Пользователи</h1></div><a class="button" href="{{ url_for('backup') }}">Скачать резервную копию</a></div><div class="grid-2"><section class="panel"><h2>Новый пользователь</h2><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Логин<input name="username" minlength="3" required></label><label>Пароль<input type="password" name="password" minlength="6" required></label><label>Роль<select name="role">{% for key,label in ROLES.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><button class="button primary">Создать</button></form></section><section class="panel"><h2>Учётные записи</h2>{% for user in users %}<form method="post" action="{{ url_for('user_update',user_id=user.id) }}" class="user-row"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div><b>{{ user.username }}</b><small>создан {{ user.created_at }}</small></div><select name="role">{% for key,label in ROLES.items() %}<option value="{{ key }}" {% if user.role==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><label class="check"><input type="checkbox" name="active" {% if user.active %}checked{% endif %}> Активен</label><input type="password" name="password" placeholder="Новый пароль"><button class="button small">Сохранить</button></form>{% endfor %}</section></div>{% endblock %}
